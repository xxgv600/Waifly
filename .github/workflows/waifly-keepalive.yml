name: Waifly Account Keepalive

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00
    # 每周一、周四各跑一次,15天窗口内留足余量;即使某次失败也还有机会
    - cron: '0 20 * * 1,4'
  workflow_dispatch: {}

concurrency:
  group: waifly-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests seleniumbase

      - name: Run keepalive
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HEADLESS: "true"
        run: python3 waifly_keepalive_discord.py
